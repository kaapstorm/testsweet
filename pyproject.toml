[project]
name = "testsweet"
version = "0.2.3"
description = "Python testing for humans"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norman Hooper", email = "kaapstorm@gmail.com" },
]
keywords = [
    "testing",
    "test",
    "test-framework",
    "test-runner",
    "unit-testing",
    "test-discovery",
    "tdd",
    "pytest",
    "unittest",
    "pythonic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
testsweet = "testsweet.__main__:cli"

[project.urls]
Homepage = "https://github.com/kaapstorm/testsweet"
Source = "https://github.com/kaapstorm/testsweet"
Documentation = "https://github.com/kaapstorm/testsweet/blob/main/README.md"
Changelog = "https://github.com/kaapstorm/testsweet/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testsweet"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "ty",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "ANN"]
ignore = [
    "ANN002",  # missing annotation for *args
    "ANN003",  # missing annotation for **kwargs
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.format]
quote-style = "single"

[tool.testsweet.discovery]
include_paths = ["tests"]
exclude_paths = ["tests/fixtures"]
